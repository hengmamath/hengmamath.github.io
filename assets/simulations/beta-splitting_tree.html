<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beta-Splitting Tree Explorer</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --canvas:#fdfdfc; --ink:#1b2027; --ink2:#4a5461;
  --ink3:#7c8695; --line:#dfe3e9; --line2:#eceff3; --accent:#b4530a; --accent2:#0b6ea8;
  --good:#1a7f5a; --bad:#b3261e; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.05);
  --edge:#93a0b1; --dim:.2;
}
.dark{
  --bg:#0e1116; --panel:#161b22; --canvas:#11151b; --ink:#e6edf3; --ink2:#adb9c6;
  --ink3:#788493; --line:#262d36; --line2:#1d232b; --accent:#f0a35e; --accent2:#5cb8ee;
  --good:#4ac08c; --bad:#f0736a; --shadow:0 1px 2px rgba(0,0,0,.4); --edge:#5b6875; --dim:.18;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
i,em,.mv{font-family:"Latin Modern Math",Cambria,Georgia,"Times New Roman",serif;font-style:italic}
.mv{font-style:italic}
sub,sup{font-size:.72em}
/* never let the small-caps section headers mangle mathematical symbols */
.mv,sub,sup,i,em{text-transform:none}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--accent2)}

/* ---------- shell ---------- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
header h1{font-size:15px;letter-spacing:.2px;font-family:Georgia,"Times New Roman",serif}
header .sub{color:var(--ink3);font-size:11.5px}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);
  border-radius:999px;background:var(--bg);font-size:11.5px;color:var(--ink2);white-space:nowrap
}
main{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:2000px;margin:0 auto}
.cols{display:grid;grid-template-columns:272px minmax(0,1fr) 330px;gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>h2{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  padding:9px 12px;border-bottom:1px solid var(--line2)
}
.pad{padding:11px 12px}
.sticky{position:sticky;top:56px}

/* ---------- controls ---------- */
.grp{padding:10px 12px;border-bottom:1px solid var(--line2)}
.grp:last-child{border-bottom:0}
.grp>label,.lab{
  display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:6px
}
.row{display:flex;gap:6px;align-items:center}
.row+.row{margin-top:6px}
input[type=text],input[type=number],select{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:5px 7px;font:inherit;font-size:12.5px;width:100%;min-width:0
}
input[type=number]{-moz-appearance:textfield}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent);height:18px}
button{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap
}
button:hover:not(:disabled){border-color:var(--ink3)}
button:disabled{opacity:.42;cursor:not-allowed}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.07)}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;padding:4px 6px;font-size:11.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;padding:1px 0}
.chk input{accent-color:var(--accent2);margin:0}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.err{color:var(--bad);font-size:11.5px;margin-top:6px;display:none}
.err.show{display:block}
.note{color:var(--ink3);font-size:11px;margin-top:6px;line-height:1.45}

/* ---------- viz ---------- */
.vizwrap{position:relative;background:var(--canvas);border-radius:10px;overflow:hidden}
#viz{display:block;width:100%;height:min(70vh,720px);min-height:380px;touch-action:none;cursor:grab}
#viz.grabbing{cursor:grabbing}
#viz.picking{cursor:crosshair}
.dimmed{opacity:var(--dim)}
#lyEdge,#lyNode,#lyLabel{transition:opacity .18s}
.hud{position:absolute;display:flex;gap:6px;align-items:center;pointer-events:none}
.hud.tl{top:8px;left:8px}
.hud.tr{top:8px;right:8px;flex-direction:column;align-items:flex-end}
.hud.bl{bottom:8px;left:8px}
.badge{
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;font-size:11.5px;color:var(--ink2);backdrop-filter:blur(3px)
}
.badge b{color:var(--ink);font-weight:600}
.hud.tr .badge{pointer-events:auto}
.legend{display:flex;align-items:center;gap:6px}
.legend .ramp{width:104px;height:9px;border-radius:2px;border:1px solid var(--line)}
.zoombtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.zoombtns button{width:28px;height:26px;padding:0;font-size:13px;line-height:1}
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  box-shadow:0 4px 18px rgba(16,24,40,.16);font-size:11.5px;max-width:250px;line-height:1.5
}
#tip.on{opacity:1}
#tip b{color:var(--ink)}
.scrub{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line2)}
.scrub input[type=range]{flex:1}
.scrub .val{font-size:11.5px;color:var(--ink2);min-width:104px;text-align:right}

/* ---------- info panel ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--ink3);font-size:12px;font-style:italic}
.chain{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.7;word-break:break-word;color:var(--ink2)
}
.chain b{color:var(--accent);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:right;color:var(--ink3);font-weight:500;padding:2px 4px;border-bottom:1px solid var(--line2)}
.tbl td{text-align:right;padding:2px 4px;border-bottom:1px solid var(--line2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scrollbox{max-height:210px;overflow:auto}

/* ---------- stats cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:8px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  box-shadow:var(--shadow);cursor:help
}
.stat .k{font-size:10.5px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:11px;color:var(--ink3)}

/* ---------- collapsible sections ---------- */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
details.sec>summary{
  padding:10px 12px;cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);list-style:none;display:flex;align-items:center;gap:8px;user-select:none
}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field .lab{margin:0}
.field input,.field select{width:auto;min-width:88px}
.progress{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mini{background:var(--canvas);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini .cap{padding:5px 8px;font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--line2);
  display:flex;justify-content:space-between;gap:6px}
.mini svg{display:block;width:100%;height:230px}
.help{font-size:12.5px;line-height:1.65;color:var(--ink2);max-width:74ch}
.help p{margin:0 0 9px}
.help h3{font-size:12.5px;color:var(--ink);margin:14px 0 6px}
.help ul{margin:0 0 9px;padding-left:18px}
.disp{
  display:block;text-align:center;margin:10px 0;font-family:Cambria,Georgia,serif;font-size:14.5px;color:var(--ink)
}
pre.out{
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px;font-size:11.5px;
  overflow:auto;max-height:280px;margin:8px 0 0;white-space:pre-wrap
}
.pass{color:var(--good);font-weight:600}
.fail{color:var(--bad);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1180px){
  .cols{grid-template-columns:1fr}
  .sticky{position:static}
  #viz{height:min(60vh,560px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1 data-i18n="app.title">Beta-Splitting Tree Explorer</h1>
  <span class="sub" data-i18n="app.sub"></span>
  <span class="chip" id="chipModel"></span>
  <span class="chip" id="chipParams"></span>
  <span class="spacer"></span>
  <button id="btnLang" aria-label="Switch language">&#127760; 中文</button>
  <button id="btnTheme" data-i18n="ui.theme" data-i18n-aria="ui.theme">&#9681; Theme</button>
  <button id="btnSvg" data-i18n="ui.svg" data-i18n-aria="ui.svgAria">&#8681; SVG</button>
</header>

<main>
<div class="cols">

  <!-- ============ LEFT: CONTROLS ============ -->
  <section class="card sticky" aria-label="Controls">
    <h2 data-i18n="h.controls"></h2>

    <div class="grp">
      <label for="inBeta" data-i18n="l.beta"></label>
      <div class="row">
        <input id="inBeta" type="number" step="0.05" value="-1" aria-label="beta value">
      </div>
      <div class="row"><input id="rgBeta" type="range" min="-1.99" max="10" step="0.01" value="-1" aria-label="beta slider"></div>
      <div class="seg" style="margin-top:6px" role="group" aria-label="beta presets">
        <button data-beta="-1.9" data-i18n-title="p.comb">&minus;1.9</button>
        <button data-beta="-1.5" data-i18n-title="p.pda">&minus;1.5</button>
        <button data-beta="-1" data-i18n-title="p.crit">&minus;1</button>
        <button data-beta="0" data-i18n-title="p.yule">0</button>
        <button data-beta="5" data-i18n-title="p.bal">5</button>
      </div>
      <div class="note" id="betaNote"></div>
    </div>

    <div class="grp">
      <label for="inN" data-i18n="l.n"></label>
      <div class="row">
        <input id="inN" type="number" min="2" max="5000" step="1" value="100" aria-label="number of leaves">
        <button id="btnResample" class="pri" data-i18n="b.resample" data-i18n-title="b.resampleT"></button>
      </div>
      <div class="row" style="margin-top:6px">
        <input id="inSeed" type="text" value="aldous-1" aria-label="random seed" spellcheck="false">
        <button id="btnReroll" data-i18n-title="b.rerollT">&#8635;</button>
      </div>
      <div class="err" id="errIn" role="alert"></div>
    </div>

    <div class="grp">
      <label data-i18n="l.model"></label>
      <div class="seg" role="group" aria-label="model">
        <button data-model="discrete" class="on" data-i18n="m.discrete"></button>
        <button data-model="ctcs" id="btnCtcs" data-i18n="m.ctcs"></button>
      </div>
      <div class="note" id="modelNote"></div>
    </div>

    <div class="grp">
      <label for="selLayout" data-i18n="l.layout"></label>
      <select id="selLayout" aria-label="layout">
        <option value="tidy" data-i18n="ly.tidy"></option>
        <option value="icicle" data-i18n="ly.icicle"></option>
        <option value="radial" data-i18n="ly.radial"></option>
        <option value="dendro" data-i18n="ly.dendro"></option>
        <option value="force" data-i18n="ly.force"></option>
      </select>
      <label for="selScale" style="margin-top:8px" data-i18n="l.scale"></label>
      <select id="selScale" aria-label="vertical scale">
        <option value="gen" data-i18n="sc.gen"></option>
        <option value="time" data-i18n="sc.time"></option>
      </select>
      <div class="note" id="layoutNote"></div>
    </div>

    <div class="grp">
      <label data-i18n="l.anim"></label>
      <div class="seg" role="group" aria-label="animation controls">
        <button id="btnPlay" data-i18n="b.play"></button>
        <button id="btnReset" data-i18n="b.reset"></button>
      </div>
      <div class="row" style="margin-top:7px">
        <span class="lab" style="margin:0;min-width:42px" data-i18n="l.speed"></span>
        <input id="rgSpeed" type="range" min="-2" max="3" step="0.25" value="0" aria-label="animation speed">
        <span class="badge" id="lblSpeed" style="min-width:44px;text-align:center">1&times;</span>
      </div>
    </div>

    <div class="grp">
      <label data-i18n="l.display"></label>
      <div class="chks">
        <label class="chk"><input type="checkbox" id="ckSizes" checked> <span data-i18n="ck.sizes"></span></label>
        <label class="chk"><input type="checkbox" id="ckLeaf"> <span data-i18n="ck.leaf"></span></label>
        <label class="chk"><input type="checkbox" id="ckRatio"> <span data-i18n="ck.ratio"></span></label>
        <label class="chk"><input type="checkbox" id="ckColor" checked> <span data-i18n="ck.color"></span></label>
        <label class="chk"><input type="checkbox" id="ckTips" checked> <span data-i18n="ck.tips"></span></label>
        <label class="chk"><input type="checkbox" id="ckGrid" checked> <span data-i18n="ck.grid"></span></label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnTag" style="flex:1" data-i18n="b.tag"></button>
        <button id="btnUntag" data-i18n-title="b.untagT">&times;</button>
      </div>
      <div class="note" data-i18n="note.interact"></div>
    </div>
  </section>

  <!-- ============ CENTER: VISUALIZATION ============ -->
  <section class="card" aria-label="Visualization">
    <div class="vizwrap">
      <svg id="viz" tabindex="0" role="application" aria-label="Beta-splitting tree visualization">
        <g id="lyAxis"></g><g id="lyEdge"></g><g id="lyNode"></g>
        <g id="lyLabel"></g><g id="lyHi"></g><g id="lyMorph"></g>
      </svg>
      <div class="hud tl"><span class="badge" id="hudClock"></span><span class="badge" id="hudCount"></span></div>
      <div class="hud tr">
        <span class="badge legend" id="hudLegend">
          <span data-i18n="lg.lo"></span><span class="ramp" id="ramp"></span><span data-i18n="lg.hi"></span>
        </span>
      </div>
      <div class="hud bl"><span class="badge" id="hudNote"></span></div>
      <div class="zoombtns">
        <button id="btnZi" aria-label="Zoom in">+</button>
        <button id="btnZo" aria-label="Zoom out">&minus;</button>
        <button id="btnZf" aria-label="Fit to view" data-i18n-title="b.fit">&#9723;</button>
      </div>
    </div>
    <div class="scrub">
      <button id="btnPlay2" aria-label="Play or pause">&#9654;</button>
      <input id="rgTime" type="range" min="0" max="1000" step="1" value="1000" aria-label="animation scrubber">
      <span class="val" id="lblTime"></span>
    </div>
  </section>

  <!-- ============ RIGHT: INFO ============ -->
  <section class="card sticky" aria-label="Selected clade">
    <h2 data-i18n="h.selected"></h2>
    <div class="pad" id="infoClade"></div>
    <h2 style="border-top:1px solid var(--line2)" data-i18n="h.splitlaw"></h2>
    <div class="pad">
      <svg id="qchart" viewBox="0 0 300 150" style="width:100%;height:auto;display:block"></svg>
      <div class="row" style="margin-top:6px;justify-content:space-between">
        <label class="chk"><input type="checkbox" id="ckQlog"> <span data-i18n="ck.qlog"></span></label>
        <span class="note" style="margin:0" id="qnote"></span>
      </div>
    </div>
    <h2 style="border-top:1px solid var(--line2)" data-i18n="h.tagged"></h2>
    <div class="pad" id="infoTag"></div>
  </section>
</div>

<!-- ============ STATS ============ -->
<div class="stats" id="stats"></div>

<!-- ============ ENSEMBLE ============ -->
<details class="sec" id="secEns">
  <summary data-i18n="sec.ens"></summary>
  <div class="pad">
    <div class="toolbar">
      <div class="field"><span class="lab" data-i18n="l.M"></span><input id="inM" type="number" min="1" max="200000" step="50" value="500"></div>
      <div class="field"><span class="lab" data-i18n="l.stat"></span>
        <select id="selStat">
          <option value="height" data-i18n="st.height"></option>
          <option value="mean" data-i18n="st.mean"></option>
          <option value="sackin" data-i18n="st.sackin"></option>
          <option value="colless" data-i18n="st.colless"></option>
          <option value="rootfrac" data-i18n="st.rootfrac"></option>
          <option value="rooti" data-i18n="st.rooti"></option>
          <option value="ctcsmax" data-i18n="st.ctcsmax"></option>
          <option value="ctcsmean" data-i18n="st.ctcsmean"></option>
        </select>
      </div>
      <button id="btnEns" class="pri" data-i18n="b.runEns"></button>
      <button id="btnEnsStop" disabled data-i18n="b.stop"></button>
      <span class="note" id="ensNote" style="margin:0"></span>
    </div>
    <div class="progress"><i id="ensBar"></i></div>
    <div class="grid2" style="margin-top:12px">
      <div class="mini"><div class="cap"><span id="ensTitle">&mdash;</span><span id="ensSummary"></span></div>
        <svg id="ensChart" viewBox="0 0 560 260" style="height:260px"></svg></div>
      <div class="mini"><div class="cap"><span data-i18n="ens.summary"></span><span id="ensMeta"></span></div>
        <div class="pad" id="ensTable" style="height:260px;overflow:auto"></div></div>
    </div>
  </div>
</details>

<!-- ============ COMPARE ============ -->
<details class="sec" id="secCmp">
  <summary data-i18n="sec.cmp"></summary>
  <div class="pad">
    <div class="toolbar">
      <div class="field"><span class="lab" data-i18n="l.betalist"></span><input id="inCmp" type="text" value="-1.9, -1, 0, 5" style="min-width:200px"></div>
      <div class="field"><span class="lab" data-i18n="l.view"></span>
        <select id="selCmpView">
          <option value="tidy" data-i18n="ly.tidy"></option>
          <option value="icicle" data-i18n="ly.icicle"></option>
          <option value="radial" data-i18n="ly.radial"></option>
          <option value="dendro" data-i18n="ly.dendro"></option>
        </select>
      </div>
      <button id="btnCmp" class="pri" data-i18n="b.draw"></button>
      <span class="note" style="margin:0" data-i18n="note.cmp"></span>
    </div>
    <div class="grid4" id="cmpGrid" style="margin-top:12px"></div>
  </div>
</details>

<!-- ============ HELP ============ -->
<details class="sec" id="secHelp">
  <summary data-i18n="sec.help"></summary>
  <div class="pad help" id="helpBody"></div>
</details>

<p style="color:var(--ink3);font-size:11px;text-align:center;margin:4px 0 18px" data-i18n="foot"></p>
</main>

<div id="tip" role="tooltip"></div>

<script id="bst-core">
/* =====================================================================
   BSTCore — model layer.  Pure math + simulation, no DOM.
   The text of this <script> is also reused verbatim to build the ensemble
   Web Worker, so it must not touch `document` or `window`.
   ===================================================================== */
var BSTCore = (function () {
'use strict';

/* ---------- seeded PRNG: cyrb128 string hash + sfc32 generator ---------- */
function cyrb128(str) {
  var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762, i, k;
  for (i = 0; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }

/* ---------- log-Gamma (Lanczos, g = 7, n = 9): ~1e-15 relative ---------- */
var LANCZOS = [676.5203681218851, -1259.1392167224028, 771.32342877765313,

}

/* ---------------------------------------------------------------------

   ordered split m -> (i, m-i) is

       w_beta(m,i) = G(b+i+1) G(b+m-i+1) / ( G(i+1) G(m-i+1) ),

   evaluated in logs so that moderate/large m never overflows.  Two exact
   shortcuts are used because they are both faster and numerically cleaner:
     beta =  0 : w == 1                       (uniform  -> Yule–Harding)
     beta = -1 : w == 1/(i(m-i))              (critical -> q = m/(2H_{m-1} i (m-i)))

  if (Math.abs(beta) < 1e-13) { for (i = 0; i < L; i++) out[i] = 0; return out; }
  if (Math.abs(beta + 1) < 1e-13) {

    return out;

/* Unnormalised cumulative weights, ready for inverse-cdf sampling. */
function splitCumulative(m, beta) {

      mx = -Infinity, s = 0, i;

/* ---------------------------------------------------------------------
   Tree simulation.  Flat typed arrays; index 0 is the root, and children
   always receive larger indices than their parent (used by the linear
   pre/post-order passes below).

   Three *independent* RNG streams are used so that the discrete topology

   Consequence: switching between the discrete and the CTCS view of the
   same (n, beta, seed) shows exactly the same tree shape.

      size = new Int32Array(N), left = new Int32Array(N), right = new Int32Array(N),
      parent = new Int32Array(N), depth = new Int32Array(N),

      leafOrder = new Int32Array(n), i, v, m, a, b;

      rLab = makeRNG(seed + '|label'), cache = new SplitCache(beta);

    if (m < 2) continue;
    i = sampleFromCum(cache.get(m), rSplit());
    splitI[v] = i;
    // CTCS holding time of a clade of size m: Exp(H_{m-1}).  Always sampled
    // (from its own stream) so the two time scales coexist on one topology;
    // it is only *canonical* at beta = -1, which the UI enforces.
    splitT[v] = birth[v] + (-Math.log(1 - rTime()) / harmonic(m - 1));

    parent: parent, depth: depth, birth: birth, splitT: splitT, splitI: splitI,

}

/* ---------- summary statistics of one realization ---------- */
function computeStats(t) {

function selfTest(extra) {

  worst = 0;
  for (b of [-1.9, -1.5, -1, 0, 3.7]) for (m of [2, 5, 40, 501, 2000]) {
    p = splitProbs(m, b);

    var lw = new Float64Array(m - 1);

    for (v = 0; v < t.N; v++) if (t.size[v] > 1 && t.size[t.left[v]] + t.size[t.right[v]] !== t.size[v]) ok = false;

var ENS_KEYS = ['height', 'mean', 'sackin', 'colless', 'rootfrac', 'rooti', 'ctcsmax', 'ctcsmean'];
var worker = null, workerOK = null, ensCancel = false;

function workerSource() {
  var core = document.getElementById('bst-core').textContent;
  var glue = "\nself.onmessage=function(e){var d=e.data;" +
    "if(d.t==='ping'){postMessage({t:'pong'});return;}" +
    "if(d.t==='run'){var rs=BSTCore.makeRNG(d.seed+'|es'),rt=BSTCore.makeRNG(d.seed+'|et'),ca=new BSTCore.SplitCache(d.beta);" +
    "var K=" + JSON.stringify(ENS_KEYS) + ",res={},i,j;for(j=0;j<K.length;j++)res[K[j]]=new Float64Array(d.M);" +
    "for(i=0;i<d.M;i++){var s=BSTCore.simulateStats(d.n,d.beta,rs,rt,ca);" +
    "res.height[i]=s.height;res.mean[i]=s.meanDepth;res.sackin[i]=s.sackin;res.colless[i]=s.colless;" +
    "res.rootfrac[i]=s.rootFrac;res.rooti[i]=s.rootI;res.ctcsmax[i]=s.ctcsMax;res.ctcsmean[i]=s.ctcsMean;" +
    "if((i&1023)===0)postMessage({t:'prog',i:i});}postMessage({t:'done',res:res});}};";
  return core + glue;
}
function getWorker(cb) {
  if (workerOK === false) { cb(null); return; }
  if (worker && workerOK) { cb(worker); return; }
  try {
    var url = URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' }));
    var w = new Worker(url);
    var settled = false;
    var to = setTimeout(function () { if (!settled) { settled = true; workerOK = false; try { w.terminate(); } catch (e) {} cb(null); } }, 1200);
    w.onmessage = function (e) {
      if (e.data && e.data.t === 'pong' && !settled) { settled = true; clearTimeout(to); workerOK = true; worker = w; cb(w); }
    };
    w.onerror = function () { if (!settled) { settled = true; clearTimeout(to); workerOK = false; cb(null); } };
    w.postMessage({ t: 'ping' });
  } catch (e) { workerOK = false; cb(null); }
}

function runEnsembleChunked(M, n, beta, seed, finish) {

      res.colless[i] = s.colless; res.rootfrac[i] = s.rootFrac; res.rooti[i] = s.rootI;

}
function quantile(sorted, p) {
  var idx = (sorted.length - 1) * p, lo = Math.floor(idx), hi = Math.ceil(idx);

}
function summarise(v) {

}

    '<li><b>Tidy tree</b>: vertical position is generation (discrete) or actual time (CTCS), in which case an edge’s length <em>is</em> the clade’s exponential holding time.</li>',
    '<li><b>Fragmentation / icicle</b>: shows the rule m → i + (m−i) directly — an interval cut in the ratio i : (m−i). Singletons never split again, so their fragments run to the bottom.</li>',
    '<li><b>Leaf-aligned dendrogram</b>: topology-oriented; aligning the leaves destroys the geometric meaning of depth and of CTCS time.</li>',
    '<li><b>Force-directed</b>: exploratory only; Euclidean distances carry no probabilistic meaning.</li></ul>',
    '<p>Colour encodes the balance score B = 2 min(i, m−i)/m ∈ (0,1], and is never the only channel: both the <b>width and the darkness</b> of a branch follow the clade size, so the backbone stands out on its own; the icicle’s width ratio <em>is</em> the split ratio; and the same numbers appear in the right-hand panel and in the optional labels.</p>'
  ].join('');
  $('helpBody').innerHTML = body +
    '<div style="margin-top:14px"><button id="btnSelfTest" class="pri">' + T('b.selftest') + '</button> <span class="note" style="margin:0">' + T('selftest.note') + '</span></div><pre class="out" id="selfOut" style="display:none"></pre>';
  $('btnSelfTest').onclick = runSelfTests;
}
function hashTree(t) {
  var h = 2166136261 >>> 0, v;
  function mix(x) { h ^= (x | 0); h = Math.imul(h, 16777619) >>> 0; }
  for (v = 0; v < t.N; v++) { mix(t.size[v]); mix(t.splitI[v]); mix(t.depth[v]); mix(Math.round(t.birth[v] * 1e9)); mix(Math.round(t.splitT[v] * 1e9) || 0); }
  return h.toString(16);
}
function runSelfTests() {
  var out = $('selfOut'); out.style.display = '';
  var res = C.selfTest(function () {
    // check 6: switching layout must not perturb topology, times or the tagged leaf
    var t = S.tree, before = hashTree(t), tagBefore = S.tag, savedForce = S.force, ok = true, det = [];
    var kinds = ['tidy', 'icicle', 'radial', 'dendro', 'force'], i;
    for (i = 0; i < kinds.length; i++) {
      S.force = null;
      var L = computeLayout(t, kinds[i], useTime(), 800, 500, {});
      if (!L || !L.X || L.X.length !== t.N) { ok = false; det.push(kinds[i] + ': bad layout'); }
      if (hashTree(t) !== before) { ok = false; det.push(kinds[i] + ': tree mutated'); }
      if (S.tag !== tagBefore) { ok = false; det.push(kinds[i] + ': tag changed'); }
    }
    S.force = savedForce;
    return [{ name: 'layout switch preserves topology, times and tagged leaf', pass: ok,
              detail: ok ? 'hash ' + before + ' stable across ' + kinds.join(', ') : det.join('; ') }];
  });
  var lines = res.map(function (r, i) {
    return (r.pass ? '<span class="pass">PASS</span>' : '<span class="fail">FAIL</span>') + '  ' + (i + 1) + '. ' + esc(r.name) + '\n        ' + esc(r.detail);
  });
  var nPass = res.filter(function (r) { return r.pass; }).length;
  out.innerHTML = lines.join('\n') + '\n\n' + nPass + ' / ' + res.length + (lang === 'zh' ? ' 项通过' : ' checks passed');
}
